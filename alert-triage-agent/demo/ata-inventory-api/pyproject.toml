[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ata-inventory-api"
version = "0.1.0"
description = "Demo Inventory API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
