[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ata-agent"
version = "0.1.0"
description = "Alert Triage Agent Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-monitoring>=2.19.0",
    "google-cloud-tasks>=2.16.0",
    # Gemini gray-zone correlation (Vertex AI): genai.Client(vertexai=True, ...).models.generate_content
    "google-genai>=1.20.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "topology*"]

[tool.setuptools.package-data]
topology = ["*.md"]
