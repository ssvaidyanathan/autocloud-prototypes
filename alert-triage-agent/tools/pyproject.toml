[project]
name = "ata-tools"
version = "0.1.0"
description = "FastMCP Read-Only Telemetry Server for Alert Triage Agent"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "google-auth>=2.29.0",
    "google-cloud-monitoring>=2.20.0",
    "google-cloud-logging>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "topology"]
