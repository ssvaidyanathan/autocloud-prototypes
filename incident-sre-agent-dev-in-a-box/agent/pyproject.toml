[project]
name = "sre-agent"
version = "0.1.0"
description = "Multi-agent SRE investigation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "google-adk==2.11.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-cloud-build>=3.25.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-container>=2.45.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-monitoring>=2.23.0",
    "google-cloud-run>=0.10.0",
    "google-genai==2.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
markers = [
    "live: marks tests as live integration tests (deselect with '-m \"not live\"')",
]
