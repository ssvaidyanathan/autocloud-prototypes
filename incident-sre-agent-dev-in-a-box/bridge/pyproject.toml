[project]
name = "incident-bridge"
version = "0.1.0"
description = "Incident Bridge service for ServiceNow, Jira, and Cloud Tasks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "google-auth>=2.29.0",
    "google-cloud-tasks>=2.16.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
