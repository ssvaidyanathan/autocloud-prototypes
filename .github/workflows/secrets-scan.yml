name: Secrets Scan

# Repo-wide gitleaks scan (issue #46). Deliberately has no path filter so that
# every file in the repository is covered, not just one sub-project.
# - pull_request / push: scans the commits in the PR or push.
# - schedule / workflow_dispatch: scans the full git history.
# Rule config (default ruleset plus a narrow allowlist) is in .gitleaks.toml,
# which gitleaks auto-loads; exact historical fingerprints are in .gitleaksignore.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Read is required for the action to list a pull request's commits.
  # Write (for inline PR comments) is intentionally not granted: comments are
  # disabled below, and findings are reported in the job summary instead.
  pull-requests: read

jobs:
  gitleaks:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
