name: MCP Deploy Context Stub CI

on:
  push:
    branches: [ main ]
    paths:
      - 'incident-sre-agent-dev-in-a-box/mcp-deploy-context-stub/**'
      - '.github/workflows/mcp-deploy-context-stub-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'incident-sre-agent-dev-in-a-box/mcp-deploy-context-stub/**'
      - '.github/workflows/mcp-deploy-context-stub-ci.yml'

defaults:
  run:
    working-directory: incident-sre-agent-dev-in-a-box/mcp-deploy-context-stub

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Ruff check and format
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: Mypy check
        run: |
          source .venv/bin/activate
          mypy app

  test:
    name: Unit & Conformance Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run Pytest
        run: |
          source .venv/bin/activate
          pytest -v tests/

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Validate Terraform stack
        run: |
          terraform -chdir="infra/terraform" fmt -check
          terraform -chdir="infra/terraform" init -backend=false
          terraform -chdir="infra/terraform" validate
