name: Sample Pipeline App CI/CD

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install --no-cache-dir ruff>=0.3.0

      - name: Run Ruff Lint
        run: ruff check app/

  unit-test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: pip install --no-cache-dir .[test]

      - name: Run Pytest
        run: pytest tests/ -v

  build-container:
    name: Container Build & Package
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: docker build -t sample-pipeline-app:${{ github.sha }} .

  deploy-cloudrun:
    name: Deploy to Cloud Run
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: env.PROJECT_ID != ''

      - name: Deploy to Cloud Run
        env:
          SERVICE_NAME: sample-pipeline-app
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/deploy.sh
