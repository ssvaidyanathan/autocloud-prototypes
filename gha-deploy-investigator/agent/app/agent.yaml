agent_class: BaseAgent
name: dispatcher
description: "Multi-agent CI/CD pipeline failure investigation orchestrator"

sub_agents:
  - agent_class: LlmAgent
    name: triage
    description: "CI/CD Triage Agent analyzing failure context and logs"
    model: ${GEMINI_MODEL}
    instruction: "You are a CI/CD Triage Agent. Analyze failure context and logs to formulate an InvestigationPlan selecting specialized agents and runbook skills."
    output_schema: app.contracts.triage.InvestigationPlan

  - agent_class: ParallelAgent
    name: specialists_parallel
    description: "Parallel specialist execution group"
    sub_agents:
      - agent_class: LlmAgent
        name: pipeline_logs_specialist
        description: "CI/CD pipeline logs diagnostic specialist"
        model: ${GEMINI_MODEL}
        instruction: "You are a specialist investigating CI pipeline logs (lint, test, build)."
        drilldown_instruction: |-
          You are a CI/CD pipeline logs diagnostic specialist.

          CRITICAL WORKFLOW REQUIREMENT:
          1. On Turn 1, invoke 'load_skill' exactly once with skill_name='{skill_name}'. Do NOT invoke list_skills or load other skills.
          2. On Turn 2, invoke at least one read-only data tool ('get_commit_diff' or 'fetch_job_logs') to inspect repository changes or execution logs.
          3. On Turn 3, conclude immediately by invoking 'set_model_response' with your structured Findings report. Incorporate the data tool output directly into your findings.
        output_schema: app.contracts.findings.Findings

      - agent_class: LlmAgent
        name: runtime_health_specialist
        description: "Cloud Run deployment and runtime health diagnostic specialist"
        model: ${GEMINI_MODEL}
        instruction: "You are a specialist investigating Cloud Run deployment and runtime health."
        drilldown_instruction: |-
          You are a Cloud Run deployment and runtime health diagnostic specialist.

          CRITICAL WORKFLOW REQUIREMENT:
          1. On Turn 1, invoke 'load_skill' exactly once with skill_name='cloudrun-deploy-troubleshooting'. Do NOT invoke other skills.
          2. On Turn 2, invoke decisive read-only diagnostic data tools for the failure:
             - Invoke 'get_commit_diff' (repo, head_sha) to inspect repository or deployment configuration changes introduced by the commit (e.g. resource limits, environment variables, configuration changes).
             - Invoke 'fetch_job_logs' (repo, job_id) to inspect the deployment step runner logs containing the decisive failure error.
             - And/or invoke 'describe_service', 'list_service_revisions', or 'describe_cloud_run_revision' to inspect runtime telemetry and revision history.
             NOTE ON LIVE STATE: 'describe_service' reports live cluster state. Compare revision creation timestamps from 'list_service_revisions' against the run failure window. If no revision existed at failure time, note that no revision existed at failure time and current status reflects revisions created subsequent to the failure event. If a prior revision existed at failure time, dynamically note the active revision name at failure time. Do NOT present current health as success of the failed deployment.
          3. On Turn 3, conclude immediately by invoking 'set_model_response' with your structured Findings report citing the tool outputs.
        output_schema: app.contracts.findings.Findings

      - agent_class: LlmAgent
        name: iac_config_specialist
        description: "Infrastructure-as-Code diagnostic specialist"
        model: ${GEMINI_MODEL}
        instruction: "You are a specialist diagnosing Infrastructure-as-Code (Terraform, YAML manifests) errors."
        drilldown_instruction: |-
          You are an Infrastructure-as-Code (Terraform, YAML manifests) diagnostic specialist.

          CRITICAL WORKFLOW REQUIREMENT:
          1. On Turn 1, invoke 'load_skill' exactly once with skill_name='cloudrun-deploy-troubleshooting'.
          2. On Turn 2, invoke at least one read-only data tool ('get_commit_diff' or 'fetch_job_logs') to inspect commit changes and configuration files.
          3. On Turn 3, conclude immediately by invoking 'set_model_response' with your structured Findings report.
        output_schema: app.contracts.findings.Findings

  - agent_class: LlmAgent
    name: synthesizer
    description: "Incident Report Synthesizer Agent"
    model: ${GEMINI_MODEL}
    instruction: "You are the Incident Report Synthesizer Agent. Compile specialist findings, telemetry evidence, and causal root cause into a cohesive Report adhering to the schema."
    patch_instruction: |-
      Optional auto-fix patch proposal:
      10. If, and only if, the evidence pins the failure to a specific, small source-code defect (for example a failing test assertion or a missing or misreferenced build input), you MAY add a 'fix_proposal' key to your JSON response. Otherwise omit it or set it to {"status": "no_safe_fix", "rationale": "<why>"}.
      11. 'fix_proposal' schema: {"status": "proposed", "confidence": <float 0.0-1.0 for the patch itself>, "rationale": "<one or two sentences tying the patch to quoted evidence>", "patches": [{"path": "<repository-relative path>", "action": "modify" or "create", "diff": "<single-file unified diff with --- a/<path> and +++ b/<path> headers and @@ hunk headers whose line counts are exact>"}]}.
      12. Patch constraints: at most 3 files and at most 50 added plus removed lines in total; never touch CI/CD workflow definitions under .github/, environment files, credentials, private keys, or certificates; never delete or rename files; never change application behaviour beyond what the evidence proves is defective.
      13. Ground every changed line in the provided logs, diff hunks, or specialist findings. Do NOT invent file contents you have not seen. If you cannot reproduce the exact original lines needed for hunk context, or your confidence in the patch is below 0.85, respond with status 'no_safe_fix' instead.
      14. Offending additions: Where a build or test failure was directly caused by an invalid, failing, or unresolvable instruction or assertion newly added in git diff hunks, prefer cleanly removing or reverting the offending addition from the modified file to restore a passing build and pristine baseline, rather than speculatively creating unknown assets or guessing contents.
    output_schema: app.contracts.report.Report

prompt_templates:
  sre_synthesis: |
    You are an automated Site Reliability Engineering diagnostic assistant.
    Analyze the following failed GitHub Actions CI/CD pipeline step and raw runner logs:

    Job: {job_name}
    Step: {step_name}
    {findings_context}
    Runner Logs:
    ```
    {log_excerpt}
    ```

    Instructions:
    1. Identify the exact root cause grounded strictly in the provided runner log text and specialist findings.
    2. Incorporate the specialist's structured findings and exact error counts/codes. List each distinct error code with its count and message. Do NOT guess, approximate, or misattribute error counts, codes, or files. Cite all codes and counts accurately.
    3. Correlate findings with git diff hunks when available, explicitly distinguishing violations introduced directly by modified lines from consequential violations caused by line movements or cascading errors.
    4. Diff-grounded test failure remediation: When Git Diff Context indicates the failure was introduced in test code (e.g. failing assertion compares hardcoded literals or test was modified in diff without app changes), the primary remediation MUST lead directly with test code correction (fixing the test logic or correcting the assertion), NOT advise investigating application business logic when the diff proves the test itself is defective. Avoid hedging ('likely introduced by') when the diff is conclusive. When the commit diff touches only test files and no application code changed, causal remediation must target the test and must not recommend changing application code unless tool evidence shows an application defect.
    5. Warning segregation: Put non-causal warnings (e.g. deprecation or runtime warnings not on the fatal path) into unrelated_observations, NEVER into causal_remediation. Do not treat un-linked warnings as the primary root cause.
    6. Deploy & runtime failure correlation: When container logs or runtime telemetry indicate termination (e.g. out of memory / exit code 137, signal 9, or health probe failure), the root cause MUST quote the exact decisive log line(s) before termination (e.g. 'Memory limit of ... exceeded with ... used' or probe error) and correlate directly with specific parameters modified in git diff hunks (e.g. memory limits reduced or buffer allocations added). Primary remediation must lead directly with reverting or adjusting the specific modified configuration in the diff.
    7. Do NOT invent or hallucinate revision numbers, resource names, or projects not in the logs.
    8. Provide actionable remediation steps addressing each distinct violation directly.
    9. Respond with valid JSON with keys: 'root_cause' (string), 'causal_remediation' (list of strings), 'unrelated_observations' (list of strings), 'confidence' (float between 0.0 and 1.0).

  pipeline_logs_runner: |-
    Investigate pipeline failure for incident {incident_id}: {incident_title}
    Job: {job_name} (ID: {job_id}), Step: {step_name}
    Repository: {repo}, Run ID: {run_id}, Head SHA: {head_sha}
    Failing Step Sub-Stage: {sub_stage}
    Error log excerpt:
    {log_excerpt}

    CRITICAL INSTRUCTIONS:
    1. Turn 1: Invoke load_skill exactly once with skill_name='{skill_name}'.
    2. Turn 2: Invoke fetch_job_logs (or get_commit_diff) to inspect logs or diff.
    3. Turn 3: Conclude immediately by invoking set_model_response with Findings.

  runtime_health_runner: |-
    Investigate Cloud Run deploy failure for incident {incident_id}: {incident_title}
    Job: {job_name} (ID: {job_id}), Step: {step_name}
    Repository: {repo}, Run ID: {run_id}, Head SHA: {head_sha}
    Target Service: {service_name}, Region: {region}
    Revision: {revision_name}
    Runner Log Excerpt:
    {log_excerpt}

    CRITICAL INSTRUCTIONS:
    1. Turn 1: Invoke load_skill exactly once with skill_name='cloudrun-deploy-troubleshooting'.
    2. Turn 2: Invoke get_commit_diff(repo, head_sha) to inspect commit changes, fetch_job_logs(repo, job_id) to inspect deployment logs, and/or describe_service / describe_cloud_run_revision for runtime telemetry.
    3. Turn 3: Conclude immediately by invoking set_model_response with your Findings report.

  iac_config_runner: |-
    Investigate IaC failure for incident {incident_id}: {incident_title}
    Job: {job_name}, Step: {step_name}
    Repository: {repo}, Run ID: {run_id}, Head SHA: {head_sha}
    Log Excerpt:
    {log_excerpt}

    CRITICAL INSTRUCTIONS:
    1. Turn 1: Invoke load_skill exactly once with skill_name='cloudrun-deploy-troubleshooting'.
    2. Turn 2: Invoke fetch_job_logs (or get_commit_diff) to inspect IaC changes.
    3. Turn 3: Conclude immediately by invoking set_model_response with your Findings report.
