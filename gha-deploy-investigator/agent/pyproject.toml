[project]
name = "gha-deploy-investigator-agent"
version = "0.1.0"
description = "GitHub Actions Deployment Investigator Agent Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "cryptography>=42.0.0",
    "google-auth>=2.29.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
