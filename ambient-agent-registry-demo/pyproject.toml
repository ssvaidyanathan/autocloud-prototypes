[project]
name = "ambient-agent-registry-demo"
version = "0.1.0"
description = "Ambient Agent Registry Demo - Pure ADK /run Runtime with Dynamic GCP Agent Registry Skills & Tools"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.11.0",
    "google-api-core>=2.19.0",
    "google-auth>=2.29.0",
    "a2a-sdk>=0.3.4",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
